[platformio]
default_envs = cardputer_permanent

[env]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
build_flags =
	-DESP32S3
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
lib_deps =
	M5Cardputer=https://github.com/m5stack/M5Cardputer

[env:cardputer_auto]
build_flags =
	${env.build_flags}
	-DAUTO_PAIRING_MODE

[env:cardputer_permanent]
build_flags =
	${env.build_flags}
	-DPERMANENT_PAIRING_MODE
